version: '3.9'

services:
  starfish-controller-site2:
    container_name: starfish-controller-site2
    build:
      context: .
    image: starfish-controller
    depends_on:
      - controller-scheduler-site2
      - controller-run-worker-site2
      - controller-processor-worker-site2
      - redis-site2
    ports:
      - '8002:8000'
    env_file:
      - .env.site2
    command: bash -c "cron && python3 manage.py runserver 0.0.0.0:8000"
    volumes:
      - artifacts-site2:/starfish-controller/local
      - ./starfish:/app/starfish
      - ./manage.py:/app/manage.py

  controller-scheduler-site2:
    container_name: starfish-controller-scheduler-site2
    build:
      context: .
    image: starfish-controller
    depends_on:
      - redis-site2
    env_file:
      - .env.site2
    entrypoint: [ "celery", "-A", "starfish", "beat", "-l", "DEBUG" ]
    volumes:
      - artifacts-site2:/starfish-controller/local
      - ./starfish:/app/starfish

  controller-run-worker-site2:
    container_name: starfish-controller-run-worker-site2
    build:
      context: .
    image: starfish-controller
    depends_on:
      - redis-site2
    env_file:
      - .env.site2
    entrypoint: [ "celery", "-A", "starfish", "worker", "-l", "DEBUG", "-Q", "starfish.run" ]
    volumes:
      - artifacts-site2:/starfish-controller/local
      - ./starfish:/app/starfish

  controller-processor-worker-site2:
    container_name: starfish-controller-processor-worker-site2
    build:
      context: .
    image: starfish-controller
    depends_on:
      - redis-site2
    env_file:
      - .env.site2
    entrypoint: [ "celery", "-A", "starfish", "worker", "-l", "DEBUG", "--concurrency=1", "-Q", "starfish.processor" ]
    volumes:
      - artifacts-site2:/starfish-controller/local
      - ./starfish:/app/starfish

  redis-site2:
    image: redis:5.0
    ports:
      - "6380:6379"
    volumes:
      - redis_data_site2:/opt/redis/data

  openclaw-site2-perms:
    build:
      context: ..
      dockerfile: workbench/Dockerfile.openclaw
    image: starfish-openclaw:latest
    pull_policy: never
    container_name: openclaw-perms-site2
    user: "0:0"
    command: ["sh", "-lc", "mkdir -p /home/node/.openclaw /home/node/.openclaw/workspace && chown -R 1000:1000 /home/node/.openclaw"]
    restart: "no"
    volumes:
      - openclaw_config_site2:/home/node/.openclaw
      - openclaw_workspace_site2:/home/node/.openclaw/workspace

  openclaw-site2:
    build:
      context: ..
      dockerfile: workbench/Dockerfile.openclaw
    image: starfish-openclaw:latest
    pull_policy: never
    container_name: openclaw-gateway-site2
    depends_on:
      openclaw-site2-perms:
        condition: service_completed_successfully
    ports:
      - '18790:18789'
    env_file:
      - openclaw.site2.env
    environment:
      OPENCLAW_CONTROL_UI_ALLOWED_ORIGINS: "http://localhost:18790,http://127.0.0.1:18790,ws://localhost:18790,ws://127.0.0.1:18790"
      PYTHONPATH: /home/node/.openclaw/workspace/starfish-cli
    volumes:
      - openclaw_config_site2:/home/node/.openclaw
      - openclaw_workspace_site2:/home/node/.openclaw/workspace
      - ../cli:/home/node/.openclaw/workspace/starfish-cli:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18789/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  artifacts-site2: {}
  redis_data_site2: {}
  openclaw_config_site2: {}
  openclaw_workspace_site2: {}

networks:
  default:
    name: starfishworkbench_starfish-network
    external: true
